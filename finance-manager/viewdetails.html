<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Expenses - JSS College Finance</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-900 to-slate-900">
    <!-- Navigation -->
    <nav class="glass-nav fixed top-0 left-0 right-0 z-50 px-4 py-3">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg">
                    <span class="text-white font-bold text-lg">JSS</span>
                </div>
                <div class="text-white">
                    <h1 class="text-lg font-semibold">Expense Details</h1>
                </div>
            </div>
            <div class="flex gap-4">
                <a href="index.html" class="nav-link px-4 py-2 rounded-lg text-white hover:bg-white/10 transition-all duration-300">Home</a>
                <a href="viewlist.html" class="nav-link px-4 py-2 rounded-lg text-white hover:bg-white/10 transition-all duration-300">View List</a>
                <a href="login.html" class="nav-link px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white transition-all duration-300">Admin</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 pt-24 pb-12">
        <!-- Header Card -->
        <div class="glass-card max-w-5xl mx-auto p-8 rounded-3xl mb-8">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-3xl font-bold text-white mb-2">Expense Report</h2>
                    <p class="text-indigo-300">Track all fund expenses with detailed records</p>
                </div>
                <button onclick="downloadPDF()" class="flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-xl hover:scale-105 transition-transform shadow-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    Download Report
                </button>
            </div>

            <!-- Summary Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white/5 rounded-xl p-6 text-center">
                    <div class="text-4xl font-bold text-red-400 mb-2" id="totalExpensesDisplay">₹0</div>
                    <div class="text-indigo-300">Total Expenses</div>
                </div>
                <div class="bg-white/5 rounded-xl p-6 text-center">
                    <div class="text-4xl font-bold text-yellow-400 mb-2" id="expenseCount">0</div>
                    <div class="text-indigo-300">Total Transactions</div>
                </div>
                <div class="bg-white/5 rounded-xl p-6 text-center">
                    <div class="text-4xl font-bold text-green-400 mb-2" id="avgExpense">₹0</div>
                    <div class="text-indigo-300">Average Expense</div>
                </div>
            </div>
        </div>

        <!-- Expense Table -->
        <div class="glass-card max-w-5xl mx-auto p-6 rounded-3xl overflow-hidden">
            <h3 class="text-xl font-bold text-white mb-6">Expense History</h3>
            
            <div class="overflow-x-auto">
                <table class="w-full" id="expenseTable">
                    <thead>
                        <tr class="border-b border-white/10">
                            <th class="text-left py-4 px-4 text-indigo-300 font-medium">#</th>
                            <th class="text-left py-4 px-4 text-indigo-300 font-medium">Date</th>
                            <th class="text-left py-4 px-4 text-indigo-300 font-medium">Reason</th>
                            <th class="text-right py-4 px-4 text-indigo-300 font-medium">Amount</th>
                        </tr>
                    </thead>
                    <tbody id="expenseTableBody" class="text-white">
                        <!-- Expenses will be loaded here -->
                    </tbody>
                    <tfoot>
                        <tr class="border-t-2 border-indigo-500">
                            <td colspan="3" class="py-4 px-4 text-right font-bold text-white text-lg">Total:</td>
                            <td class="py-4 px-4 text-right font-bold text-red-400 text-lg" id="tableTotal">₹0</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="glass-card max-w-5xl mx-auto p-12 rounded-3xl text-center hidden">
            <div class="w-20 h-20 mx-auto mb-6 bg-white/5 rounded-full flex items-center justify-center">
                <svg class="w-10 h-10 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                </svg>
            </div>
            <h4 class="text-2xl font-bold text-white mb-2">No Expenses Yet</h4>
            <p class="text-indigo-300">Expenses will appear here once added by admin</p>
        </div>
    </main>

    <script>
        // Load expenses from localStorage
        let expenses = JSON.parse(localStorage.getItem('expenses')) || [];

        // Render expenses
        function renderExpenses() {
            const tbody = document.getElementById('expenseTableBody');
            const emptyState = document.getElementById('emptyState');
            const expenseTable = document.getElementById('expenseTable');

            if (expenses.length === 0) {
                expenseTable.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            expenseTable.classList.remove('hidden');
            emptyState.classList.add('hidden');
            tbody.innerHTML = '';

            let total = 0;

            expenses.forEach((expense, index) => {
                const row = document.createElement('tr');
                row.className = 'border-b border-white/5 hover:bg-white/5 transition-colors';
                
                total += expense.amount;

                row.innerHTML = `
                    <td class="py-4 px-4 text-indigo-300">#${index + 1}</td>
                    <td class="py-4 px-4">${expense.date}</td>
                    <td class="py-4 px-4 font-medium">${expense.reason}</td>
                    <td class="py-4 px-4 text-right font-medium text-red-400">₹${expense.amount.toLocaleString()}</td>
                `;
                tbody.appendChild(row);
            });

            // Update total displays
            document.getElementById('tableTotal').textContent = `₹${total.toLocaleString()}`;
            document.getElementById('totalExpensesDisplay').textContent = `₹${total.toLocaleString()}`;
            document.getElementById('expenseCount').textContent = expenses.length;
            document.getElementById('avgExpense').textContent = expenses.length > 0 
                ? `₹${Math.round(total / expenses.length).toLocaleString()}` 
                : '₹0';
        }

        // Download PDF report
        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Header
            doc.setFontSize(20);
            doc.setFont('helvetica', 'bold');
            doc.text('JSS College of Education - Banahatti', 14, 20);
            
            doc.setFontSize(16);
            doc.setFont('helvetica', 'normal');
            doc.text('Finance Management System - Expense Report', 14, 30);
            
            doc.setFontSize(10);
            doc.text(`Generated Date: ${new Date().toLocaleDateString('en-IN', { day: '2-digit', month: 'long', year: 'numeric' })}`, 14, 38);
            
            // Summary
            let total = expenses.reduce((sum, e) => sum + e.amount, 0);
            
            doc.setFontSize(12);
            doc.setFont('helvetica', 'bold');
            doc.text('Summary', 14, 50);
            
            doc.setFont('helvetica', 'normal');
            doc.text(`Total Transactions: ${expenses.length}`, 14, 58);
            doc.text(`Total Expenses: ₹${total.toLocaleString()}`, 14, 65);
            
            if (expenses.length > 0) {
                doc.text(`Average Expense: ₹${Math.round(total / expenses.length).toLocaleString()}`, 14, 72);
            }

            // Prepare data for table
            const tableData = expenses.map((expense, index) => [
                index + 1,
                expense.date,
                expense.reason,
                `₹${expense.amount.toLocaleString()}`
            ]);

            // Add table
            doc.autoTable({
                startY: 80,
                head: [['#', 'Date', 'Reason', 'Amount']],
                body: tableData,
                theme: 'grid',
                headStyles: {
                    fillColor: [79, 70, 229],
                    textColor: 255,
                    fontStyle: 'bold'
                },
                alternateRowStyles: {
                    fillColor: [245, 245, 255]
                },
                margin: { top: 80, right: 14, bottom: 20, left: 14 }
            });

            // Footer
            const pageCount = doc.internal.getNumberOfPages();
            for (let i = 1; i <= pageCount; i++) {
                doc.setPage(i);
                doc.setFontSize(8);
                doc.text('JSS College of Education - Banahatti | Finance Management System', 14, doc.internal.pageSize.height - 10);
            }

            doc.save('finance-expense-report.pdf');
        }

        // Initial load
        renderExpenses();
    </script>
</body>
</html>
