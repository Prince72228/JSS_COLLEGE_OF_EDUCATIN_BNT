<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Member List - JSS College Finance</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-900 to-slate-900">
    <!-- Navigation -->
    <nav class="glass-nav fixed top-0 left-0 right-0 z-50 px-4 py-3">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg">
                    <span class="text-white font-bold text-lg">JSS</span>
                </div>
                <div class="text-white">
                    <h1 class="text-lg font-semibold">Member List</h1>
                </div>
            </div>
            <div class="flex gap-4">
                <a href="index.html" class="nav-link px-4 py-2 rounded-lg text-white hover:bg-white/10 transition-all duration-300">Home</a>
                <a href="viewdetails.html" class="nav-link px-4 py-2 rounded-lg text-white hover:bg-white/10 transition-all duration-300">View Details</a>
                <a href="login.html" class="nav-link px-4 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white transition-all duration-300">Admin</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container mx-auto px-4 pt-24 pb-12">
        <!-- Header Card -->
        <div class="glass-card max-w-6xl mx-auto p-8 rounded-3xl mb-8">
            <h2 class="text-3xl font-bold text-white mb-2">Member Payment Status</h2>
            <p class="text-indigo-300">Track collection payments for all 97 class members</p>
            
            <!-- Quick Stats -->
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">
                <div class="bg-white/5 rounded-xl p-4 text-center">
                    <div class="text-3xl font-bold text-white" id="totalMembers">97</div>
                    <div class="text-indigo-300 text-sm">Total Members</div>
                </div>
                <div class="bg-white/5 rounded-xl p-4 text-center">
                    <div class="text-3xl font-bold text-green-400" id="paidMembers">0</div>
                    <div class="text-indigo-300 text-sm">Paid</div>
                </div>
                <div class="bg-white/5 rounded-xl p-4 text-center">
                    <div class="text-3xl font-bold text-red-400" id="unpaidMembers">97</div>
                    <div class="text-indigo-300 text-sm">Unpaid</div>
                </div>
                <div class="bg-white/5 rounded-xl p-4 text-center">
                    <div class="text-3xl font-bold text-yellow-400">₹<span id="totalCollected">0</span></div>
                    <div class="text-indigo-300 text-sm">Collected</div>
                </div>
            </div>
        </div>

        <!-- Search and Filter -->
        <div class="glass-card max-w-6xl mx-auto p-6 rounded-3xl mb-8">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-1">
                    <input type="text" id="searchInput" placeholder="Search by name..." class="w-full px-6 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-indigo-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all">
                </div>
                <div class="flex gap-2">
                    <button onclick="filterMembers('all')" class="filter-btn px-6 py-3 rounded-xl bg-indigo-600 text-white hover:bg-indigo-700 transition-all" data-filter="all">All</button>
                    <button onclick="filterMembers('paid')" class="filter-btn px-6 py-3 rounded-xl bg-white/10 text-white hover:bg-white/20 transition-all" data-filter="paid">Paid</button>
                    <button onclick="filterMembers('unpaid')" class="filter-btn px-6 py-3 rounded-xl bg-white/10 text-white hover:bg-white/20 transition-all" data-filter="unpaid">Unpaid</button>
                </div>
            </div>
        </div>

        <!-- Member List Table -->
        <div class="glass-card max-w-6xl mx-auto p-6 rounded-3xl overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="border-b border-white/10">
                            <th class="text-left py-4 px-4 text-indigo-300 font-medium">ID</th>
                            <th class="text-left py-4 px-4 text-indigo-300 font-medium">Name</th>
                            <th class="text-left py-4 px-4 text-indigo-300 font-medium">Status</th>
                            <th class="text-right py-4 px-4 text-indigo-300 font-medium">Amount</th>
                        </tr>
                    </thead>
                    <tbody id="memberTableBody" class="text-white">
                        <!-- Members will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Initialize data if not exists
        const defaultMembers = [];

        // Load from localStorage or use default
        let members = JSON.parse(localStorage.getItem('members')) || [];
        let collectionAmount = parseFloat(localStorage.getItem('collectionAmount')) || 0;

        // Import default member names
        const defaultMemberNames = [
            "Sudharani Appanna Kamble", "Mahalingappa Bharamannavar", "Manjula Sannakki", 
            "Amar Ashok Honnamani", "Kadambari Choudappa Gadiwaddar", "Shreechandra Dodamani",
            "Bharati Chatni", "Uday Mahaling Mahantashetti", "Muragesh Bagewadi", "Yashoda Balavad",
            "Abdulvahab Kurshidalam Teradal", "Mahammadsameer Ramjan Makandar", "Basuraj Ravi Maradi",
            "Nandeppa Suresh Shirahatti", "Darshan Kakhandaki", "Savita Bhimashi Hanchanal",
            "Ameer Shekh", "Tangevva B Patil", "Jyoti Mathagar", "Gayatri Sanju Naduvinamani",
            "Swati Sahadev Pattanashetti", "Ashwini Rajashekharayya Hiremath", "Niyaz Imam Sab Horatti",
            "Kiran Hawaldar", "Ruksar Faniband", "Nisarga Dodamani", "Gurunath Kittur",
            "Vinayak Hasilkar", "Keerti Mallappa Urabhinnavar", "Kavita Kiran Sutar",
            "Prashant Ningappa Ullagaddi", "Sunita Mathapati", "Sushmita Mahadev Vadegali",
            "Swati Balappa Jiddimani", "Padmini Nagappa Madar", "Sneha Laxman Uppar",
            "Gangappa Raju Madappagol", "Rekha Anand Hanjagi", "Aishwarya Uttur", 
            "Bhagyashree Mallappa Ramadurg", "Anupallavi Ramesh Madiwalar", "Jyoti Dundappa Gasti",
            "Priyanka Adiveppa Lokuri", "Sangeeta Uppar", "Bharati Siddaram Athani",
            "Shashikala Annappa Gaggari", "Archana Shanta Hosamani", "Rajeshwari Satyappa Nayak",
            "Bhagirathi Mallappa Alagur", "Laxmi Kallappa Ganiger", "Renuka Rajaput",
            "Siddarth Masti", "Savitri Raju Gurav", "Divya Basappa Raval", "Mahazabeen Muradsab Hanagandi",
            "Akshata Shirol", "Rohini M Jadhav", "Adamali Dastagirsab Nadaf", "Rohit S Rajaput",
            "Vaishali Anand Shirhatti", "Revati Kanatti", "Shridevi Shatteppa Gangappagol",
            "Soumya Savadi", "Venktesh Benakatti", "Kaveri Madar", "Chaithra Sadappa Chinchakhandi",
            "Kavya Sadashiv Kadapatti", "Mahantesh Hiremath", "Sahana Nagaraj Metri",
            "Neelamma Angadi", "Keerti Billur", "Fatima Yadawad", "Keerti Mode",
            "Tejashwini Vishnu Dharennavar", "Gangavva Arjun Kattimani", "Kaveri Subhas Kalmaddi",
            "Tanjila Ilayi Pinjar", "Bhagyashree Channabasu Biradarpatil", "Asmita A Savant",
            "Sujata Mudhol", "Aishwarya Shanur Gadadi", "Bhaghyshri Ashok Gurav", "Priyanka Mutturaj Patrot",
            "Laxmi Vittal Athani", "Preeti Itagoni", "Sana Shamansab Mujavar", "Ashwini Ashok Badiger",
            "Gayatri Appasi Maranur", "Shreyanka Kadappa Badagi"
        ];

        // Initialize members if empty
        if (members.length === 0) {
            members = defaultMemberNames.map((name, index) => ({
                id: index + 1,
                name: name,
                status: "NO",
                amount: 0
            }));
            localStorage.setItem('members', JSON.stringify(members));
        }

        // Render member list
        function renderMembers(membersToRender) {
            const tbody = document.getElementById('memberTableBody');
            tbody.innerHTML = '';

            membersToRender.forEach(member => {
                const row = document.createElement('tr');
                row.className = 'border-b border-white/5 hover:bg-white/5 transition-colors';
                
                const statusBadge = member.status === 'YES' 
                    ? '<span class="px-3 py-1 rounded-full text-xs font-medium bg-green-500/20 text-green-400">Paid</span>'
                    : '<span class="px-3 py-1 rounded-full text-xs font-medium bg-red-500/20 text-red-400">Unpaid</span>';

                row.innerHTML = `
                    <td class="py-4 px-4 text-indigo-300">#${member.id}</td>
                    <td class="py-4 px-4 font-medium">${member.name}</td>
                    <td class="py-4 px-4">${statusBadge}</td>
                    <td class="py-4 px-4 text-right">₹${member.amount.toLocaleString()}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Update statistics
        function updateStats() {
            const paid = members.filter(m => m.status === 'YES').length;
            const unpaid = members.filter(m => m.status === 'NO').length;
            const total = members.length;
            const collected = paid * collectionAmount;

            document.getElementById('totalMembers').textContent = total;
            document.getElementById('paidMembers').textContent = paid;
            document.getElementById('unpaidMembers').textContent = unpaid;
            document.getElementById('totalCollected').textContent = collected.toLocaleString();
        }

        // Filter members
        function filterMembers(filter) {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            let filtered = members;

            if (filter === 'paid') {
                filtered = members.filter(m => m.status === 'YES');
            } else if (filter === 'unpaid') {
                filtered = members.filter(m => m.status === 'NO');
            }

            if (searchQuery) {
                filtered = filtered.filter(m => m.name.toLowerCase().includes(searchQuery));
            }

            renderMembers(filtered);

            // Update filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600');
                btn.classList.add('bg-white/10');
            });
            document.querySelector(`[data-filter="${filter}"]`).classList.remove('bg-white/10');
            document.querySelector(`[data-filter="${filter}"]`).classList.add('bg-indigo-600');
        }

        // Search handler
        document.getElementById('searchInput').addEventListener('input', () => {
            const activeFilter = document.querySelector('.filter-btn.bg-indigo-600').dataset.filter;
            filterMembers(activeFilter);
        });

        // Initial load
        updateStats();
        renderMembers(members);
    </script>
</body>
</html>
