<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - JSS College Finance</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-900 via-indigo-900 to-slate-900 flex items-center justify-center p-4">
    <!-- Navigation -->
    <nav class="glass-nav fixed top-0 left-0 right-0 z-50 px-4 py-3">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center shadow-lg">
                    <span class="text-white font-bold text-lg">JSS</span>
                </div>
                <div class="text-white">
                    <h1 class="text-lg font-semibold">Admin Login</h1>
                </div>
            </div>
            <div class="flex gap-4">
                <a href="index.html" class="nav-link px-4 py-2 rounded-lg text-white hover:bg-white/10 transition-all duration-300">Home</a>
                <a href="viewlist.html" class="nav-link px-4 py-2 rounded-lg text-white hover:bg-white/10 transition-all duration-300">View List</a>
                <a href="viewdetails.html" class="nav-link px-4 py-2 rounded-lg text-white hover:bg-white/10 transition-all duration-300">View Details</a>
            </div>
        </div>
    </nav>

    <!-- Login Card -->
    <div class="glass-card w-full max-w-md p-10 rounded-3xl mt-20 login-card">
        <div class="text-center mb-8">
            <div class="w-20 h-20 mx-auto mb-4 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-2xl flex items-center justify-center shadow-lg">
                <svg class="w-10 h-10 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-white mb-2">Admin Access</h2>
            <p class="text-indigo-300">Enter credentials to manage the finance system</p>
        </div>

        <form id="loginForm" class="space-y-6">
            <div>
                <label class="block text-indigo-300 text-sm mb-2">Username</label>
                <div class="relative">
                    <input type="text" id="username" required class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="Enter username">
                    <svg class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </div>
            </div>

            <div>
                <label class="block text-indigo-300 text-sm mb-2">Password</label>
                <div class="relative">
                    <input type="password" id="password" required class="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-indigo-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all" placeholder="Enter password">
                    <svg class="absolute right-4 top-1/2 -translate-y-1/2 w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
            </div>

            <div id="error" class="hidden bg-red-500/20 border border-red-500/50 rounded-xl p-4 text-red-400 text-center"></div>

            <button type="submit" class="w-full py-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-semibold rounded-xl hover:scale-105 transition-transform shadow-lg">
                Login to Dashboard
            </button>
        </form>

        <div class="mt-6 text-center">
            <p class="text-indigo-300 text-sm">Default credentials provided for setup</p>
        </div>
    </div>

    <script>
        // Animate login card on load
        gsap.from('.login-card', {
            y: 50,
            opacity: 0,
            duration: 1,
            ease: 'power3.out'
        });

        // Login handler
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('error');

            // Check credentials
            if (username === 'admin' && password === 'Admin') {
                // Set admin session
                sessionStorage.setItem('adminLoggedIn', 'true');
                
                // Add success animation
                gsap.to('.login-card', {
                    scale: 1.05,
                    duration: 0.2,
                    yoyo: true,
                    repeat: 1,
                    onComplete: () => {
                        window.location.href = 'admin.html';
                    }
                });
            } else {
                errorDiv.classList.remove('hidden');
                errorDiv.textContent = 'Invalid username or password';
                
                // Shake animation
                gsap.to('.login-card', {
                    x: [-10, 10, -10, 10, 0],
                    duration: 0.5
                });
            }
        });
    </script>
</body>
</html>
