<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Member List – JSS Finance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen">
  <div class="max-w-6xl mx-auto px-4 py-10">
    <header class="flex items-center justify-between gap-4 flex-wrap">
      <div>
        <h1 class="text-2xl font-semibold">Member List</h1>
        <p class="opacity-80">Realtime synced across all devices • Showing <span id="memberCount">0</span></p>
      </div>
      <nav class="flex items-center gap-2">
        <a class="btn ghost" href="index.html">Home</a>
        <a class="btn ghost" href="viewdetails.html">Expenses</a>
        <a class="btn primary" href="login.html">Admin</a>
      </nav>
    </header>

    <section class="mt-8 glass border-glow rounded-3xl p-6 md:p-8">
      <div class="grid md:grid-cols-3 gap-3 items-end">
        <div class="md:col-span-2">
          <label class="text-sm opacity-80">Search</label>
          <input id="memberSearch" class="input mt-1" placeholder="Search by name..." />
        </div>
        <div>
          <label class="text-sm opacity-80">Filter</label>
          <select id="memberFilter" class="input mt-1">
            <option value="all">All</option>
            <option value="paid">Paid</option>
            <option value="unpaid">Unpaid</option>
          </select>
        </div>
      </div>

      <div class="mt-5 overflow-auto">
        <table class="table">
          <thead>
            <tr>
              <th>Student Name</th>
              <th>Amount</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="memberTbody"></tbody>
        </table>
      </div>

      <p id="fatalError" class="mt-6 text-sm text-red-200"></p>
    </section>
  </div>

  <!-- Firebase SDK (Compat for local file support) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="js/firebase.js"></script>
  <script src="js/members.js"></script>
  <script src="js/viewlist-page.js"></script>
</body>
</html>
